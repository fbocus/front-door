:root{color-scheme:dark;--gold-bright:#e8c982;--ivory:#f6efe0;--ivory-dim:#cdbfa3;--display:Georgia,'Times New Roman',serif}
*{box-sizing:border-box}html,body{margin:0}body{min-height:100vh;background:radial-gradient(1200px 700px at 50% -10%,#16294d,#0a1427 60%,#060d1b);color:var(--ivory);font:17px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
#fd{max-width:860px;margin:0 auto;text-align:center}
.fd-lang{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 18px}.fd-lang button{font:inherit;font-size:.9rem;color:var(--ivory);background:transparent;border:1px solid rgba(194,146,87,.55);border-radius:999px;padding:7px 14px;cursor:pointer}.fd-lang button[aria-selected=true]{background:#c29257;color:#1a1204;border-color:#c29257}
.fd-logo{display:block;margin:6px auto 14px;height:auto;max-width:200px;border-radius:14px}
.fd-card{background:rgba(255,255,255,.045);border:1px solid rgba(194,146,87,.5);border-radius:20px;padding:26px 22px;margin:8px auto;text-align:center}.fd-card h1{font-family:var(--display);color:var(--gold-bright);margin:0 0 10px;font-size:1.7rem;line-height:1.25}.fd-card p{margin:0 0 10px}
.fd-open{font-size:1.1rem}.fd-fine{font-size:.88rem;color:var(--ivory-dim)}.fd-sign{font-style:italic;margin-top:14px}
.fd-btn{font:inherit;color:#1a1204;background:#c29257;border:0;border-radius:999px;padding:9px 20px;cursor:pointer}
.fd-clocks{margin:22px auto 8px;text-align:center}.fd-clocks h2{font-family:var(--display);color:var(--gold-bright);margin:0 0 6px;font-size:1.3rem}.fd-clocks p{margin:0;color:var(--ivory-dim)}.fd-clocks .wc-grid{text-align:left}

  function setState(s, rs) { state = s; st = rs || null; view(); }
  function evaluate() {
    window.clearTimeout(openTimer); window.clearTimeout(retryTimer);
    var rs = FNC.restState(FD.rest, nowMs());
